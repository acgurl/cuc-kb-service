# CI for cuc-kb-service. Same jobs as .gitlab-ci.yml.
#
# Everything runs offline: no Qdrant, embedding model, reranker API, OCI or
# secrets are needed. Retrieval quality is measured by eval/ against the live
# index, not here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # lfs: false (default) — corpus/ PDFs are not needed and would use LFS bandwidth.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # production: Python 3.12.3
      - run: pip install ruff==0.14.3
      - run: ruff check --output-format=github .
      - run: python -m compileall -q -x '/(\.venv[^/]*|\.cache|data)/' .
      - run: bash -n run-mcp.sh

  # API, auth, retrieval pipeline and stdio MCP server, with the dependencies of
  # the main service venv (requirements.txt).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -t . -v

  # mcp_http_server.py runs from its own venv in production (.venv-mcp), with the
  # mcp SDK pinned to the deployed version and none of requirements.txt.
  mcp-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mcp==2.3.0" "uvicorn>=0.30"
      - run: python -m unittest tests.test_mcp_http tests.test_mcp_server -v
